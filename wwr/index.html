<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="White Water Rafting company site. This page talks is the main page">
    <meta name="author" content="Isidora Villanueva">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Home - White Water Rafting</title>
</head>

<body>
    <header>
        <img src="images/rafting-logo.png" alt="Rafting Logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero">
            <img src="images/rafting-background.jpg" alt="Rafting Activity Background">
            <h1 class="center">White Water Rafting</h1>
        </div>
        <section>
            <div class="map-form">
                <form class="box-form">
                    <h2>Newsletter Sign Up</h2>
                    <div class="item-box-input">
                        <label for="name">First Name</label>
                        <input type="text" name="name" id="name">
                    </div>
                    <div class="item-box-input">
                        <label for="last_name">Last Name</label>
                        <input type="text" name="last_name" id="last_name">
                    </div>
                    <div class="item-box-input">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email">
                    </div>
                    <div class="item-box">
                        <input type="checkbox" id="suscribe" name="suscribe" value="suscribe">
                        <label for="suscribe"> Please Suscribe me to the monthly newsletter</label>
                    </div>
                    <button class="button-form" type="submit">Sign Up Now</button>
                </form>
            </div>
        </section>
        <section>
            <h2 class="trip"><a href="trips.html">Book your trip!</a></h2>
            <div class="adventure">
                <figure>
                    <img src="images/rafting-people.jpg" alt="People doing rafting activity">
                    <figcaption><b>Group 2-4</b></figcaption>
                    <p>$50 hourly</p>
                </figure>
                <figure>
                    <img src="images/rafting-people.jpg" alt="People doing rafting activity">
                    <figcaption><b>Group 5-10</b></figcaption>
                    <p>$40 hourly</p>
                </figure>
                <figure>
                    <img src="images/rafting-people.jpg" alt="People doing rafting activity">
                    <figcaption><b>Group > 10</b></figcaption>
                    <p>$25 hourly</p>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 White Rafting Company - Isidora Villanueva</p>
        <nav class="socialmedia">
            <a href="http://www.facebook.com"><img src="images/fb-logo.png" alt="Facebook Icon"></a>
            <a href="http://www.instagram.com"><img src="images/ig-logo.png"
                  alt="Instagram Logo"></a>
            <a href="http://www.youtube.com"><img src="images/youtube-logo.png"
                  alt="Youtube Logo"></a>
        </nav>
    </footer>
</body>

</html>

<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="White Water Rafting company site. This page refers to Contact methods.">
    <meta name="author" content="Isidora Villanueva">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us - White Water Rafting</title>
</head>

<body>
    <header>
        <img src="images/rafting-logo.png" alt="Rafting Logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero-contact">
            <h1>White Water Rafting</h1>
            <div class="contact">
                <p>123 Main River Street</p>
                <p>Kolob, California</p>
                <p>+1 999 999 9999</p>
                <p>info@whitewater.com</p>
            </div>
        </div>
        <section>
            <div class="map-form">
                <img src="images/map.png" alt="Company Map">
                <form class="box">
                    <div class="item-box-input">
                        <label for="name">Name</label>
                        <input type="name" name="name" id="name">
                    </div>
                    <div class="item-box-input">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email">
                    </div>
                    <div class="item-box-radio">
                        <p>Message Purpose</p>
                        <div>
                            <input type="radio" id="general" name="general">
                            <label for="general">General Inquiry</label>
                        </div>
                        <div>
                            <input type="radio" id="reservation" name="reservation">
                            <label for="reservation">Reservation Question</label>
                        </div>
                        <div>
                            <input type="radio" id="website" name="website">
                            <label for="website">Website Suggestion</label>
                        </div>
                    </div>
                    <div class="item-box">
                        <label for="message">Message</label>
                        <textarea name="message" id="message" rows="3"
                          placeholder="Type here"></textarea>
                    </div>
                    <div class="item-box">
                        <input type="checkbox" id="suscribe" name="suscribe" value="suscribe">
                        <label for="suscribe"> Please Suscribe me to the monthly newsletter</label>
                    </div>
                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </section>
        <section>
            <h2>We Are Here to Serve You</h2>
            <div class="adventure">
                <figure>
                    <img src="images/rafting-people.jpg" alt="People doing rafting activity">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting-people.jpg" alt="People doing rafting activity">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/rafting-people.jpg" alt="People doing rafting activity">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 White Rafting Company - Isidora Villanueva</p>
        <nav class="socialmedia">
            <a href="http://www.facebook.com"><img src="images/fb-logo.png" alt="Facebook Icon"></a>
            <a href="http://www.instagram.com"><img src="images/ig-logo.png"
                  alt="Instagram Logo"></a>
            <a href="http://www.youtube.com"><img src="images/youtube-logo.png"
                  alt="Youtube Logo"></a>
        </nav>
    </footer>
</body>

</html>
